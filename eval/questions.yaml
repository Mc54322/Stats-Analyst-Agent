# Evaluation set: 30 questions with exactly one correct answer each.
#   q01-q20 (v1)   ordered from easiest to hardest.
#   q21-q30 (v1.1) harder: multi-step, merger- and submission-aware time series,
#                  and questions the data can't answer (answer_type "refusal").
# Expected answers are generated by eval/ground_truth/compute_answers.R into
# eval/ground_truth/answers.json. Questions without an entry there yet (q21-q30
# until their ground truth is written in eval/ground_truth/exercises/) are
# skipped by the eval runner.
#
# All questions use the clean parquet files exactly as they are (data as of
# 21 Oct 2026): data/clean/rtt_incomplete_provider.parquet ("RTT") and
# data/clean/ae_provider.parquet ("A&E"). RTT figures are the parquet's
# reported figures (NONC included, no estimates for missing trusts).
#
# Conventions used in the questions:
#   - "NHS trust" = a 3-character code starting with R or T
#     (grepl("^[RT][A-Z0-9]{2}$", code)), as in data/notes.md.
#   - RTT provider or national totals use only the C_999 rows
#     (is_all_specialties_total == TRUE).
#   - Percentages are answered as a number of percent (65.2 means 65.2%),
#     calculated as a ratio of sums.
#
# Grading rules:
grading:
  number: within 1% relative error of the expected value
  count: exact match
  ranking: exact match, same items in the same order
  yesno: exact match
  refusal: the answer is refusal("<why>") and the reason says why the data can't answer it

questions:

  - id: q01
    question: How many A&E attendances in total (attendances_total) did Oxford University
      Hospitals NHS Foundation Trust (org_code RTH) have in Sep 2026?
    category: lookup
    datasets: [ae]
    answer_type: number
    units: attendances
    gotcha: null
    difficulty: 1

  - id: q02
    question: How many incomplete RTT pathways did Oxford University Hospitals NHS Foundation
      Trust (provider_org_code RTH) have across all specialties (its C_999 row) in Aug 2026?
    category: lookup
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: C_999 total rows sit next to the specialty rows
    difficulty: 1

  - id: q03
    question: Does Sheffield Teaching Hospitals NHS Foundation Trust (provider_org_code RHQ)
      have any rows in the RTT table for Aug 2026? Answer yes or no.
    category: lookup
    datasets: [rtt]
    answer_type: yes/no
    units: yes/no
    gotcha: Missing submissions (Sheffield is missing from Jul 2025 onwards)
    difficulty: 1

  - id: q04
    question: How many providers in the A&E table for Sep 2026 had no A&E attendances at all
      (has_ae_activity is FALSE)?
    category: lookup
    datasets: [ae]
    answer_type: count
    units: providers
    gotcha: Many providers aren't hospitals
    difficulty: 1

  - id: q05
    question: Across all providers in the A&E table, how many patients waited over 12 hours
      from decision to admit to admission (dta_wait_over_12hrs) in Sep 2026?
    category: lookup
    datasets: [ae]
    answer_type: number
    units: patients
    gotcha: dta_wait_over_12hrs is measured from the decision to admit, not from arrival
    difficulty: 1

  - id: q06
    question: How many more distinct RTT providers (provider_org_code, counted on the C_999
      rows) were there in Aug 2026 than in Sep 2024? Give Aug 2026 count minus Sep 2024 count.
    category: comparison
    datasets: [rtt]
    answer_type: count
    units: providers
    gotcha: More providers over time
    difficulty: 1

  - id: q07
    question: What was the England total of incomplete RTT pathways in Aug 2026, as recorded
      in the RTT table (all providers, all specialties)?
    category: trap
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: C_999 total rows sit next to the specialty rows (summing every row doubles the count)
    difficulty: 2

  - id: q08
    question: In Sep 2026, what percentage of all A&E attendances in England (all types,
      booked appointments included) were 4 hours or less? Use every provider in the A&E table.
    category: trap
    datasets: [ae]
    answer_type: number
    units: percent
    gotcha: Percentages are a ratio of sums, never mean() of the pct_* columns
    difficulty: 2

  - id: q09
    question: In Sep 2026, how many percentage points higher was England's all-types 4-hour
      performance than its Type 1 4-hour performance? Calculate both as ratios of sums across
      every provider in the A&E table, then subtract (all-types minus Type 1).
    category: comparison
    datasets: [ae]
    answer_type: number
    units: percentage points
    gotcha: Two different 4-hour measures (all types vs Type 1)
    difficulty: 2

  - id: q10
    question: In Aug 2026, how many RTT pathways in England had waited more than 52 weeks but
      not more than 65 weeks? Use the C_999 rows for all providers.
    category: trap
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: over_*_weeks columns are cumulative
    difficulty: 2

  - id: q11
    question: By how much did England's total A&E attendances (attendances_total, all
      providers) change from Oct 2024 to Sep 2026? Give Sep 2026 minus Oct 2024.
    category: trend
    datasets: [ae]
    answer_type: number
    units: attendances
    gotcha: null
    difficulty: 2

  - id: q12
    question: By how much did the number of RTT pathways in England waiting more than 52 weeks
      change from Sep 2024 to Aug 2026? Use the C_999 rows for all providers and give Aug 2026
      minus Sep 2024 (negative means a fall).
    category: trend
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: C_999 total rows sit next to the specialty rows
    difficulty: 2

  - id: q13
    question: What percentage of England's incomplete RTT pathways with a known clock start
      had waited 18 weeks or less in Aug 2026? Use the C_999 rows for all providers.
    category: trap
    datasets: [rtt]
    answer_type: number
    units: percent
    gotcha: Percentages are a ratio of sums, never mean() of the pct_* columns
    difficulty: 2

  - id: q14
    question: How many RTT providers (provider_org_code) have more than one distinct
      provider_parent_org_code across all 24 months? Use the C_999 rows.
    category: lookup
    datasets: [rtt]
    answer_type: count
    units: providers
    gotcha: A provider's parent ICB can change over time
    difficulty: 2

  - id: q15
    question: Which 5 NHS trusts had the most Type 1 A&E attendances including Type 1 booked
      appointments (attendances_type1_all) in Sep 2026? List their org codes, highest first.
    category: ranking
    datasets: [ae]
    answer_type: ranking list
    units: org codes, highest first
    gotcha: NHS trust vs other providers
    difficulty: 2

  - id: q16
    question: Which 3 treatment functions had the most incomplete RTT pathways in England in
      Aug 2026, counting every specialty row (all treatment functions except C_999)? List their
      treatment_function_code values, highest first.
    category: ranking
    datasets: [rtt]
    answer_type: ranking list
    units: treatment function codes, highest first
    gotcha: X02-X06 are real specialty groups, not subtotals (and C_999 is the total)
    difficulty: 3

  - id: q17
    question: In Sep 2026, what percentage of England's A&E attendances (attendances_total, all
      providers) led to an emergency admission via A&E?
    category: trap
    datasets: [ae]
    answer_type: number
    units: percent
    gotcha: emergency_admissions_total includes admissions that didn't come through A&E
    difficulty: 3

  - id: q18
    question: North Bristol NHS Trust (RVJ) merged into RA7 in Jul 2026. Compare like for like
      across the merger. Take RA7's incomplete pathways in Jul 2026 (C_999 row) and subtract
      the combined incomplete pathways of RA7 and RVJ in Jun 2026 (their C_999 rows). What is
      the result?
    category: trap
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: Mergers break provider time series
    difficulty: 3

  - id: q19
    question: Barking, Havering and Redbridge (RF4) did not submit RTT data for Nov 2025. What
      was the like-for-like change in England's incomplete RTT pathways from Oct 2025 to Nov
      2025, counting only providers that have a C_999 row in both months? Give Nov minus Oct.
    category: trap
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: Missing submissions (a drop may be a gap in submissions, not a real fall)
    difficulty: 3

  - id: q20
    question: Among NHS trusts with at least 10,000 incomplete RTT pathways in Aug 2026 (C_999
      row), which 5 had the lowest percentage waiting 18 weeks or less? Use within_18_weeks
      divided by known_clock_start. List their provider_org_code values, lowest first.
    category: ranking
    datasets: [rtt]
    answer_type: ranking list
    units: provider codes, lowest first
    gotcha: C_999 total rows; NHS trust vs other providers
    difficulty: 3

  # --- v1.1: harder questions (ground truth written in eval/ground_truth/exercises/) ---
  # Refusal questions: answer_type "refusal" means the data can't answer the
  # question, and the correct answer is a refusal that says why. `asks_for`
  # records what kind of answer the question asks for, so the agent isn't told
  # in advance that it should refuse.

  - id: q21
    question: In Aug 2026, which 3 ICBs had the most incomplete RTT pathways? Build ICB totals
      from provider data by summing the C_999 rows of every provider, grouped by the provider's
      provider_parent_org_code in Aug 2026. List the 3 provider_parent_org_code values, highest
      first.
    category: ranking
    datasets: [rtt]
    answer_type: ranking list
    units: ICB codes, highest first
    gotcha: C_999 total rows; provider_parent_* is the ICB, and it can change over time
    difficulty: 2

  - id: q22
    question: Rank all 7 NHS England regions (parent_org in the A&E table) by all-types 4-hour
      performance in Sep 2026, lowest first. Calculate each region's performance as a ratio of
      sums across all its providers, 1 - sum(over_4hrs_total) / sum(attendances_total). List
      the parent_org names.
    category: ranking
    datasets: [ae]
    answer_type: ranking list
    units: region names, lowest first
    gotcha: Percentages are a ratio of sums, never mean() of the pct_* columns
    difficulty: 2

  - id: q23
    question: What was England's all-types A&E 4-hour performance in December 2026?
    category: trap
    datasets: [ae]
    answer_type: refusal
    asks_for: number
    units: refusal saying which months the data covers
    gotcha: Different months (the A&E table ends in Sep 2026)
    difficulty: 2

  - id: q24
    question: How many unique patients were waiting for consultant-led (RTT) treatment in England
      at the end of Aug 2026?
    category: trap
    datasets: [rtt]
    answer_type: refusal
    asks_for: number
    units: refusal explaining the data counts pathways, not patients
    gotcha: Counts are pathways, not patients
    difficulty: 2

  - id: q25
    question: How many patients in England spent more than 12 hours in A&E from arrival in
      Sep 2026?
    category: trap
    datasets: [ae]
    answer_type: refusal
    asks_for: number
    units: refusal explaining the 12-hour column is measured from the decision to admit
    gotcha: dta_wait_over_12hrs is measured from the decision to admit, not from arrival
    difficulty: 2

  - id: q26
    question: In Aug 2026, consider NHS trusts that appear both in the RTT table (C_999 row) and
      in the A&E table with Type 1 attendances (attendances_type1_all > 0). How many have more
      than 70,000 incomplete pathways and a Type 1 4-hour performance below 60%, where Type 1
      4-hour performance is 100 * (1 - over_4hrs_type1_all / attendances_type1_all)?
    category: comparison
    datasets: [rtt, ae]
    answer_type: count
    units: trusts
    gotcha: Joining RTT to A&E loses providers; NHS trust vs other providers
    difficulty: 3

  - id: q27
    question: Royal Free London (RAL) took over North Middlesex (RAP) in Jan 2025. Comparing like
      for like, what is the change in incomplete RTT pathways from Oct 2024 (RAL plus RAP, their
      C_999 rows) to Aug 2026 (RAL's C_999 row)? Give Aug 2026 minus Oct 2024.
    category: trap
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: Mergers break provider time series
    difficulty: 3

  - id: q28
    question: Counting only providers that have a C_999 row in every one of the 24 RTT months,
      what was the change in England's incomplete pathways from Sep 2024 to Aug 2026? Give
      Aug 2026 minus Sep 2024.
    category: trend
    datasets: [rtt]
    answer_type: number
    units: pathways
    gotcha: Missing submissions; more providers over time
    difficulty: 3

  - id: q29
    question: Compare each pair of consecutive RTT months like for like, counting only providers
      with a C_999 row in both months. In how many of the 23 month-to-month changes did England's
      incomplete pathways fall?
    category: trend
    datasets: [rtt]
    answer_type: count
    units: months
    gotcha: Missing submissions (a drop may be a gap in submissions, not a real fall)
    difficulty: 3

  - id: q30
    question: Among NHS trusts that have a C_999 row in every one of the 24 RTT months, excluding
      the trusts involved in mergers (RA7, RVJ, RAL, RAP), which 3 had the largest percentage
      fall in incomplete pathways from Sep 2024 to Aug 2026, where percentage change is
      (Aug 2026 - Sep 2024) / Sep 2024? List their provider_org_code values, largest fall first.
    category: ranking
    datasets: [rtt]
    answer_type: ranking list
    units: provider codes, largest fall first
    gotcha: Mergers break provider time series; missing submissions; NHS trust vs other providers
    difficulty: 3
